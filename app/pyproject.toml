[project]
name = "night-watch"
version = "0.1.0"
description = "Night Watch: a five-agent SRE fleet on Google ADK 2 graph workflows, watching a night-shift logistics operation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "google-adk==2.7.1",
    "google-genai==2.20.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "opentelemetry-sdk>=1.39",
    "opentelemetry-exporter-otlp-proto-grpc>=1.39",
]

[project.optional-dependencies]
gcp = [
    "google-cloud-firestore>=2.16",
    "google-cloud-trace>=1.11",
]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["night_watch*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
